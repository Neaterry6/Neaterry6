# Generates the contribution snake used in the profile README.
#
# Why this file exists: the README references
#   https://raw.githubusercontent.com/Neaterry6/Neaterry6/output/github-contribution-grid-snake-dark.svg
# but that image 404s unless a workflow writes the SVG to an `output` branch.
# There was no workflow in this repo, so the snake could never appear.
#
# Drop this at: .github/workflows/snake.yml
# Then: Actions tab -> "Generate Snake" -> Run workflow. It also runs daily.

name: Generate Snake

on:
  schedule:
    # every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
